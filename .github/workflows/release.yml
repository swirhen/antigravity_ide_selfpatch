name: Release Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Package Release ZIP
        id: package_zip
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          ZIP_NAME="antigravity_ide_selfpatch_${VERSION}.zip"
          zip -j "$ZIP_NAME" apply_patch.py rollback.py antigravity-session-patch.js README.md
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Antigravity IDE Enhanced Patch ${{ steps.get_version.outputs.VERSION }}
          files: ${{ steps.package_zip.outputs.zip_name }}
          body_path: Release.md
